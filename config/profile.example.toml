# perfkit 프로젝트 프로필 예시. 실제 프로필은 프로젝트 쪽(저장소 밖)에 두고 사용자 설정의 profile로 가리킨다.
# 프로젝트 고유 값(패키지 이름, 기기 정의, 시나리오, 결과 위치, 기준값 덮어쓰기, 실측 메모)은 여기에만 둔다.
# 상대 경로는 이 파일이 있는 폴더 기준이다. `~`(홈)와 환경 변수(`${VAR}`, Windows는 `%VAR%`도)를 쓸 수 있다.
# PC마다 다른 위치(Unity 프로젝트, 빌드 도구, 빌드 출력)는 환경 변수나 이 파일 옆 상대 경로로 적으면
# 같은 프로필을 여러 PC에서 그대로 쓸 수 있다.

name = "example-game"

[app]
package = "com.example.game"
# dev_suffix = ".dev"

[paths]
results = "results"

# 기기 정의. kind = "device"(실기기 → L3-D) 또는 "emulator"(→ L3-E). 회차 메타 device_profile이 이 이름을 쓴다.
[devices.phone-a]
kind = "device"
model = "<기기 모델>"
ram_class = "8GB"   # 메모리 한도 규칙(MEM-01·MEM-08)의 RAM 등급: 4GB·6GB·8GB·12GB

# (선택) perfkit device·run: SoC preset(저장소 config/devices/), 식힘 문턱, prep
preset = "exynos-mali"

[devices.phone-a.cool]
max_ap = 38.0
max_skin = 35.5
max_status = 0

[devices.emulator]
kind = "emulator"
avd = "<avd 이름>"
ram_class = "4GB"
lease = "emu-lab"              # 임대 도구로 띄우고 놓는다(없으면 "none")
avd_mismatch = "refuse"        # AVD 설정이 expect와 다르면 회차 거부(warn이면 진행하고 무효)

[devices.emulator.expect]
system_image = "system-images;android-35;google_apis;x86_64"
cores = 4
ram_mb = 4096
gpu_mode = "host"
resolution = "1080x2400"
arm_translation = true

# (선택) perfkit run 회차 공통. 자세한 칸은 docs/profile.md·docs/layers.md
[run]
saves_dir = "saves"            # <saves_dir>/<세이브 이름>/*를 기기에 넣는다
seconds = 60
sample_interval_s = 5.0
# build_info = "{apk_dir}/build-info.json"     # APK 옆 빌드 정보 JSON(자리: {apk_dir} {apk_dir_name} {apk_stem})
# count_phases = ["near", "far"]               # GPU-03·04·07 근경·원경 단계 이름(게임 측정 모드의 PHASE 이름)
# capture_start_phases = ["near", "far"]       # 프로파일러 캡처 요약을 시작할 단계(먼저 보이는 것)
# scene_load_phases = ["load_scene_begin", "load_scene_end"]  # CPU-15 씬 로드 구간

# 시나리오(게임 쪽 측정 모드가 받는 이름)
[[scenarios]]
name = "scenario-a"
save = "light"

# (선택) SCR-08 프로젝트 코드 규칙. id가 결과 by_rule 키가 된다.
[[code_rules]]
id = "find_object_of_type"
pattern = "FindObjectOfType"
note = "참조를 캐시한다"

# (선택) L0 정적 점검(perfkit static). project는 PC마다 다르면 환경 변수로 적거나
# 사용자 설정 [static] project·환경 변수 PERFKIT_STATIC_PROJECT·--project로 덮는다.
[static]
project = "${MY_GAME_PROJECT}"
source_dirs = ["Assets/Scripts"]
asset_dirs = ["Assets"]
exclude = ["Assets/ThirdParty/**"]

[static.import]
texture_size_limit = 2048

# (선택) compare --base-commit·--cand-commit이 쓰는 빌드 명령. 없으면 --base-apk·--cand-apk로 APK를 직접 준다.
# 자리: {commit} {commit8} {label} {profile_dir}. 인자마다 `~`·환경 변수를 펼친다.
# [build]
# command = ["${MY_BUILD_TOOL}", "--commit", "{commit}", "--out", "{profile_dir}/builds/{commit8}"]
# state_glob = "builds/*/build-info.json"     # 빌드가 남기는 JSON(칸: commit, file=APK 경로). 상대 경로는 이 파일 기준
# timeout_min = 40

# (선택) 보고 HTML 색(CSS 파일). 없으면 내장 색.
# [report]
# css = "theme.css"

# 항목별 메모(공개 매니페스트에 넣지 않는 실측·설명). 항목에 project_note로 붙는다.
[notes]
"FRM-01" = "기준 기기 첫 기준선: <값>"

# 덮어쓰기. 공개 매니페스트를 고치지 않고 이 프로젝트 판정만 바꾼다.
# 에뮬레이터 A/A 잡음 바닥을 잰 뒤 L3-E 잡음 등급을 채우는 곳도 여기다(none·low·medium·high).
[overrides."MEM-04".layers."L3-E"]
noise = "low"
noise_hint = "A/A 5회 반복 차 0.0~0.6%(예시)"

# 에뮬레이터에서 못 재는 지표는 층을 뺀다.
# [overrides."GPU-07"]
# drop_layers = ["L3-E"]

# 절대 기준을 이 프로젝트 값으로 바꾼다(basis는 공식·제안·프로젝트가 정함 중 하나).
# [[overrides."CPU-15".absolute]]
# metric = "ui_open_max_frame_ms"
# op = "gt"
# fail = 50
# basis = "프로젝트가 정함"
