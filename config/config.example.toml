# perfkit 사용자 설정(이 PC 전용). 저장소에 넣지 않는다.
# 위치: ~/.perfkit/config.toml (Windows는 %USERPROFILE%\.perfkit\config.toml, PERFKIT_CONFIG로 바꿈)
# 만들기: python -m perfkit config init  → 값을 채운 뒤 python -m perfkit config show
# 같은 값을 환경 변수로 주면 환경 변수가 이긴다(python -m perfkit config keys).
# 상대 경로는 이 파일이 있는 폴더 기준이다.

# 프로젝트 프로필(프로젝트마다 하나, 저장소 밖). 예시: 저장소 config/profile.example.toml
profile = "C:/path/to/project/perf/profile.toml"

[paths]
# 결과 저장 폴더. 프로필에 있으면 여기서는 비워 둔다(여기 값이 이김).
# results = "D:/perf-results/<project>"
# (선택) 점검 항목표 원본 md. 테스트가 매니페스트 ID와 대조한다.
# checklist = "C:/path/to/checklist.md"

[tools]
# 비우면 PATH의 명령을 쓴다.
# adb = "C:/Android/Sdk/platform-tools/adb.exe"
# android_sdk = "C:/Android/Sdk"
# emu_lab = "emu-lab"
# unity_slot = "C:/path/to/unity-slot.cmd"
# build_script = "C:/path/to/build.ps1"

[build]
# slot = "<project>-1"

# 기기 serial은 PC마다 다르므로 여기에 둔다. 기기 정의(종류·RAM 등급)는 프로필에 있다.
[devices.phone-a]
serial = "<adb devices에 보이는 serial>"
